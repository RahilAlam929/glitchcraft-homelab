services:
  app:
    image: node:alpine
    container_name: rahil-app
    working_dir: /app
    volumes:
      - ./app:/app
    command: node server.js
    ports:
      - "3000:3000"

  app2:
    image: node:alpine
    container_name: rahil-app2
    working_dir: /app
    volumes:
      - ./app2:/app
    command: node server.js
    ports:
      - "3001:3001"

  nginx:
    image: nginx:alpine
    container_name: homelab-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - app2
